<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hmbb-mini-logo.png" />
    <!-- No maximum-scale: hmbb-admin pins it to 1, which blocks pinch-zoom
         and is an accessibility failure on a tool used on a phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>HMBB Cost Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for everything. Chosen for legibility on a phone in a workshop:
         tall x-height, clearly differentiated letterforms, real tabular
         figures for the cost columns, and full Spanish diacritic coverage.
         Replaces DM Sans + Cormorant Garamond, whose serif display face read
         as too formal. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
